[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scrapy-quanticdata"
version = "0.1.0"
description = "Scrapy downloader middleware that sends requests through the QuanticData Web Unlocker or scrape API and returns ordinary Scrapy responses."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = ["scrapy>=2.11"]
keywords = ["scrapy", "scrapy-middleware", "web-scraping", "web-unlocker", "quanticdata", "crawler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Scrapy",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/quanticdata-io/scrapy-quanticdata"
Documentation = "https://github.com/quanticdata-io/scrapy-quanticdata#readme"
Issues = "https://github.com/quanticdata-io/scrapy-quanticdata/issues"
Changelog = "https://github.com/quanticdata-io/scrapy-quanticdata/blob/main/CHANGELOG.md"
"API reference" = "https://quanticdata.io/docs/"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/scrapy_quanticdata"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"examples/**" = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["twisted.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::scrapy.exceptions.ScrapyDeprecationWarning"]
